name: refusal
label: Refusal
version: 0.2.0
description: Detects model refusals and deflections, retries the turn on a fallback model, and injects a jailbreak kernel into the retry
author: 0ldev
license: MIT
homepage: https://github.com/0ldev/refusal
tags:
  - fallback
  - safety
  - refusal
  - routing
  - jailbreak
requires_hermes: ">=0.22.1"
capabilities: []
provides_middleware:
  - llm_execution
  - llm_request
provides_tools: []
provides_hooks:
  - on_session_finalize
  - on_session_reset
  - on_session_delete
config_schema:
  jailbreak_kernel:
    type: bool
    default: false
    label: Jailbreak kernel
    description: "Opt in to appending a no-refusal directive to the system prompt of requests after a refusal is detected in the session"
requires_env: []
  max_armed_sessions:
    type: int
    default: 1024
    label: Max armed sessions
    description: "How many sessions with an active kernel level are tracked at once; the least recently armed is forgotten first"
