[build-system]
requires = ["setuptools>=61.0,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-refusal-plugin"
version = "0.2.0"
description = "Detects model refusals and deflections, retries the turn on a fallback model, and injects a jailbreak kernel into the retry"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "0ldev"},
]
requires-python = ">=3.10"
dependencies = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
